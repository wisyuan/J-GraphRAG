[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "j-graphrag"
version = "0.1.0"
description = "J-GraphRAG: zero-LLM-generation knowledge graph extraction via Jacobian Lens workspace readout"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=5.5",
    "jlens",
    "bitsandbytes",
    "FlagEmbedding",
    "numpy",
    "scipy",
    "scikit-learn",
    "nltk",
]

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["jgraphrag"]

# jlens is not on PyPI; pin it to the GitHub repo so fresh `uv pip install -e .` works
[tool.uv.sources]
jlens = { git = "https://github.com/anthropics/jacobian-lens.git" }
